[project]
name = "importdoc-ai-backend"
version = "0.1.0"
description = "ImportDoc AI — Phase 1 MVP backend (extract, provenance, edit, Excel export)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "openai>=1.54",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "xlrd>=2.0.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
