# --- tokhai_import_v1 (Tờ khai hải quan nhập khẩu) -------------------------------
tokhai_import_v1:
  notes: >
    TKN page 1 carries the declaration header; page 2 is the fixed continuation
    sheet (ghi chú / chỉ thị hải quan / trưởng đơn vị); pages 3..N each hold one
    goods block (page_maps repeat the header on every page). HANG is veryHidden
    and mirrors the goods rows. Values are printed verbatim ('23.230', '46,46')
    because the customs layout depends on the Vietnamese formatting. Reference
    file: repo-root ToKhaiHQ7N_QDTQ_108299395961 THONG QUAN.xlsx (4 pages, 2 goods).
  policy_defaults:
    declaration.*: REVIEW_REQUIRED when critical, else AUTO_FROM_SOURCE
    goods.*: REVIEW_REQUIRED when critical, else AUTO_FROM_SOURCE
    goods_tax.*: AUTO_FROM_SOURCE
    tax.*: AUTO_FROM_SOURCE
    license.*: AUTO_FROM_SOURCE
    instruction.*: AUTO_FROM_SOURCE
    adjustment.*: AUTO_FROM_SOURCE
  critical:
