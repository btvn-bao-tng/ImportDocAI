# --- tokhai_import_v1 (Tờ khai hải quan nhập khẩu) -------------------------------
tokhai_import_v1:
  notes: >
    TKN page 1 carries the declaration header; continuation pages repeat the header
    block (page_maps) and each holds one goods block. HANG is veryHidden and mirrors
    the goods rows. Values are printed verbatim ('23.230', '46,46') because the
    customs layout depends on the Vietnamese formatting.
  policy_defaults:
    declaration.*: REVIEW_REQUIRED when critical, else AUTO_FROM_SOURCE
    goods.*: REVIEW_REQUIRED when critical, else AUTO_FROM_SOURCE
    tax.*: AUTO_FROM_SOURCE
  critical:
    - declaration.declaration_no
    - declaration.registered_at
    - declaration.importer_name
    - declaration.exporter_name
    - declaration.bill_of_lading_no
    - declaration.invoice_no
    - declaration.invoice_total
    - declaration.package_count
    - declaration.gross_weight
    - declaration.tax_exchange_rate
    - goods.hs_code
    - goods.description
    - goods.quantity_1
    - goods.invoice_amount
    - goods.unit_price
    - goods.customs_value
    - goods.origin_country_code
  manual_only:
    - declaration.customs_chief_name
    - declaration.licensed_at
    - declaration.inspection_finished_at
    - declaration.company_internal_ref
  capacity:
    goods_blocks: 2
    per_block: 1
    total_lines: 2
  pages:
    page_1: header only
    page_2: header + goods block 1
    page_3: header + goods block 2
    page_4: template page kept for overflow printing of additional blocks
