notes: >
  M0 contract. Every cell the export may touch has an explicit policy so the
  exporter can never "fill for completeness". `preferred_source_type` is the
  document family a value must come from; a value from a different family is a
  candidate for review, never an automatic override.

review_policy:
  AUTO_FROM_SOURCE: value written from a located source; unconfirmed is allowed in DRAFT
  REVIEW_REQUIRED: critical field; human CONFIRMED before FINAL
  MANUAL_ONLY: never taken from AI; reviewer input required
  FORMULA: template formula, never overwritten by the exporter
  STATIC_LABEL: fixed template text

